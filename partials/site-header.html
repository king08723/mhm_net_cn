<!-- 全站统一页眉；由 scripts/inject_partials.js 注入，{{NAV_*}} 为当前页高亮占位 -->
<header class="site-header sticky top-0 z-50 bg-[#0b1e33]/95 backdrop-blur-sm border-b border-white/10">
  <nav class="container mx-auto px-4 py-3">
    <div class="flex items-center justify-between">
      <a href="./index.html" class="flex items-center gap-3">
        <img src="./assets/logo.svg" alt="宁火明" width="48" height="48" class="rounded-md" />
        <div class="leading-tight">
          <span class="font-semibold text-lg">宁火明</span>
          <span class="block text-sm text-blue-300">NingHuoMing</span>
        </div>
      </a>

      <div class="hidden md:flex items-center gap-6">
        <a href="./index.html" class="{{NAV_INDEX}}">首页</a>
        <a href="./services.html" class="{{NAV_SERVICES}}">服务与方案</a>
        <a href="./portfolio.html" class="{{NAV_PORTFOLIO}}">案例展示</a>
        <a href="./quant.html" class="{{NAV_QUANT}}">量化系统</a>
        <a href="./contact.html" class="{{NAV_CONTACT}}">联系与关于</a>
      </div>

      <button id="mobile-menu-btn" type="button"
        class="mobile-menu-btn md:hidden text-blue-200 hover:text-white focus:outline-none cursor-pointer relative z-50"
        aria-label="打开菜单" aria-controls="mobile-menu" aria-expanded="false">
        <svg class="qi menu-icon-open" viewBox="0 0 24 24" aria-hidden="true" width="22" height="22">
          <path d="M4 7h16M4 12h16M4 17h16" />
        </svg>
        <svg class="qi menu-icon-close hidden" viewBox="0 0 24 24" aria-hidden="true" width="22" height="22">
          <path d="M6 6l12 12M18 6L6 18" />
        </svg>
        <span class="menu-btn-fallback sr-only">菜单</span>
      </button>
    </div>

    <div id="mobile-menu" class="hidden md:hidden mt-4 pb-4 border-t border-white/10">
      <div class="flex flex-col gap-4 mt-4">
        <a href="./index.html" class="block py-2 rounded-lg px-4 {{NAV_INDEX_MOBILE}}">首页</a>
        <a href="./services.html" class="block py-2 rounded-lg px-4 {{NAV_SERVICES_MOBILE}}">服务与方案</a>
        <a href="./portfolio.html" class="block py-2 rounded-lg px-4 {{NAV_PORTFOLIO_MOBILE}}">案例展示</a>
        <a href="./quant.html" class="block py-2 rounded-lg px-4 {{NAV_QUANT_MOBILE}}">量化系统</a>
        <a href="./contact.html" class="block py-2 rounded-lg px-4 {{NAV_CONTACT_MOBILE}}">联系与关于</a>
        <a href="./contact.html#contact-form"
          class="block py-3 text-center rounded-md bg-blue-600 hover:bg-blue-500 text-white font-medium">预约咨询</a>
      </div>
    </div>
  </nav>
  {{SLOGAN_BAR}}
</header>
