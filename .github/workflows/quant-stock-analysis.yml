# 路径 3：本仓编排量化分析（上游零侵入）
# 按 quant_params.engine 分流：
#   dsa（默认）→ checkout daily_stock_analysis@dev → main.py
#   tradingagents → checkout TradingAgents@dev → run_tradingagents.py
#
# 配置方式（二选一，推荐 A）：
#   A) 与旧仓相同：在本仓 Settings → Secrets and variables → Actions
#      把 daily_stock_analysis 里已有的 Secrets / Variables **同名**再建一遍
#      （Variables 可直接复制可见值；Secrets 值不可导出，需从原申请处再贴一次）
#   B) 可选：一条 QUANT_ENV / QUANT_ENV_B64（整份 KEY=VALUE），见 scripts/sync_quant_env_secret.sh
#
# TradingAgents 额外 Variables / Secrets：
#   TA_UPSTREAM_REPO / TA_UPSTREAM_REF（默认 king08723/TradingAgents@dev）
#   TRADINGAGENTS_* / OPENAI_API_KEY / GOOGLE_API_KEY / ALPHA_VANTAGE_API_KEY 等
#
# 触发：uniCloud trigger-stock-analysis → workflow_dispatch
# 结果：king08723/mhm_net_cn@analysis-results/jobs/{jobId}/*

name: Quant Stock Analysis

on:
  workflow_dispatch:
    inputs:
      stock_symbol:
        description: '分析指定股票代码（如 00700.HK, AAPL, 000001.SZ）'
        required: true
        type: string
      job_id:
        description: 'uniCloud 创建的分析任务 ID'
        required: true
        type: string
      mode:
        description: '运行模式'
        required: true
        default: 'stocks-only'
        type: choice
        options:
          - full
          - market-only
          - stocks-only
      quant_params:
        description: 'quant 页面扩展参数 JSON（含 product/engine）'
        required: false
        default: '{}'
        type: string
      force_run:
        description: '强制运行（跳过交易日检查）'
        required: false
        default: 'true'
        type: string
      upstream_ref:
        description: '上游分析仓 git ref（留空则 DSA→dev / TradingAgents→dev，或用对应 Variables）'
        required: false
        default: ''
        type: string

concurrency:
  group: quant-${{ github.event.inputs.job_id || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    # TradingAgents 多 Agent 更慢；可用 Variables.ANALYSIS_TIMEOUT_MINUTES 覆盖（建议 ≥60）
    timeout-minutes: ${{ fromJSON(vars.ANALYSIS_TIMEOUT_MINUTES || '60') }}
    outputs:
      engine: ${{ steps.resolve.outputs.engine }}
      product: ${{ steps.resolve.outputs.product }}

    steps:
      - name: Checkout orchestrator (glue)
        uses: actions/checkout@v5
        with:
          path: orchestrator

      - name: Resolve engine from quant_params
        id: resolve
        env:
          QUANT_PARAMS: ${{ github.event.inputs.quant_params || '{}' }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          params = json.loads(os.environ.get("QUANT_PARAMS") or "{}")
          engine = (params.get("engine") or "dsa").strip().lower()
          product = (params.get("product") or engine or "dsa").strip().lower()
          if engine in ("ta", "trading-agents"):
              engine = "tradingagents"
          if engine not in ("dsa", "tradingagents"):
              engine = "dsa"
          out = os.environ["GITHUB_OUTPUT"]
          with open(out, "a", encoding="utf-8") as f:
              f.write(f"engine={engine}\n")
              f.write(f"product={product}\n")
          print(f"::notice::Quant engine={engine} product={product}")
          PY

      - name: Checkout DSA upstream
        if: ${{ steps.resolve.outputs.engine != 'tradingagents' }}
        uses: actions/checkout@v5
        with:
          repository: ${{ vars.UPSTREAM_REPO || 'king08723/daily_stock_analysis' }}
          ref: ${{ github.event.inputs.upstream_ref || vars.UPSTREAM_REF || 'dev' }}
          path: analysis
          token: ${{ secrets.UPSTREAM_CHECKOUT_TOKEN || github.token }}

      - name: Checkout TradingAgents upstream
        if: ${{ steps.resolve.outputs.engine == 'tradingagents' }}
        uses: actions/checkout@v5
        with:
          repository: ${{ vars.TA_UPSTREAM_REPO || 'king08723/TradingAgents' }}
          ref: ${{ github.event.inputs.upstream_ref || vars.TA_UPSTREAM_REF || 'dev' }}
          path: analysis
          token: ${{ secrets.UPSTREAM_CHECKOUT_TOKEN || github.token }}

      - name: Quant phase checkout
        if: ${{ github.event.inputs.job_id != '' }}
        continue-on-error: true
        env:
          JOB_ID: ${{ github.event.inputs.job_id }}
          SYMBOL: ${{ github.event.inputs.stock_symbol }}
          QUANT_PRODUCT: ${{ steps.resolve.outputs.product }}
          QUANT_ENGINE: ${{ steps.resolve.outputs.engine }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANALYSIS_DOCS_BRANCH: analysis-results
        run: bash orchestrator/scripts/quant_bridge.sh mark checkout

      - name: Setup Python (DSA 3.11)
        if: ${{ steps.resolve.outputs.engine != 'tradingagents' }}
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: analysis/requirements.txt

      - name: Setup Python (TradingAgents 3.12)
        if: ${{ steps.resolve.outputs.engine == 'tradingagents' }}
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: analysis/pyproject.toml

      - name: Install DSA dependencies
        if: ${{ steps.resolve.outputs.engine != 'tradingagents' }}
        working-directory: analysis
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          python -c "import futu; print('✅ futu SDK import OK')"

      - name: Install TradingAgents dependencies
        if: ${{ steps.resolve.outputs.engine == 'tradingagents' }}
        working-directory: analysis
        run: |
          pip install --upgrade pip
          pip install .
          python -c "from tradingagents.graph.trading_graph import TradingAgentsGraph; print('✅ TradingAgents import OK')"

      - name: Prepare directories
        run: mkdir -p analysis/data analysis/logs analysis/reports

      - name: Quant bridge pre
        if: ${{ github.event.inputs.job_id != '' }}
        continue-on-error: true
        env:
          JOB_ID: ${{ github.event.inputs.job_id }}
          SYMBOL: ${{ github.event.inputs.stock_symbol }}
          QUANT_PRODUCT: ${{ steps.resolve.outputs.product }}
          QUANT_ENGINE: ${{ steps.resolve.outputs.engine }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANALYSIS_DOCS_BRANCH: analysis-results
        run: bash orchestrator/scripts/quant_bridge.sh pre

      # 与旧仓 00-daily-analysis.yml 相同：从本仓 Secrets/Variables 注入
      # 未配置的项为空，不影响；只需把你实际在用的那约 26 个同名迁过来
      - name: Run stock analysis
        working-directory: analysis
        env:
          # 可选整包（没有就留空）
          QUANT_ENV: ${{ secrets.QUANT_ENV }}
          QUANT_ENV_B64: ${{ secrets.QUANT_ENV_B64 }}

          # —— AI / LLM（DSA） ——
          GENERATION_BACKEND: ${{ vars.GENERATION_BACKEND || secrets.GENERATION_BACKEND }}
          GENERATION_FALLBACK_BACKEND: ${{ vars.GENERATION_FALLBACK_BACKEND || secrets.GENERATION_FALLBACK_BACKEND || 'litellm' }}
          GENERATION_BACKEND_TIMEOUT_SECONDS: ${{ vars.GENERATION_BACKEND_TIMEOUT_SECONDS || secrets.GENERATION_BACKEND_TIMEOUT_SECONDS }}
          GENERATION_BACKEND_MAX_OUTPUT_BYTES: ${{ vars.GENERATION_BACKEND_MAX_OUTPUT_BYTES || secrets.GENERATION_BACKEND_MAX_OUTPUT_BYTES }}
          GENERATION_BACKEND_MAX_CONCURRENCY: ${{ vars.GENERATION_BACKEND_MAX_CONCURRENCY || secrets.GENERATION_BACKEND_MAX_CONCURRENCY }}
          LITELLM_CONFIG: ${{ vars.LITELLM_CONFIG || secrets.LITELLM_CONFIG }}
          LITELLM_CONFIG_YAML: ${{ vars.LITELLM_CONFIG_YAML || secrets.LITELLM_CONFIG_YAML }}
          LITELLM_API_KEY: ${{ secrets.LITELLM_API_KEY }}
          LITELLM_MODEL: ${{ vars.LITELLM_MODEL || secrets.LITELLM_MODEL }}
          LITELLM_FALLBACK_MODELS: ${{ vars.LITELLM_FALLBACK_MODELS || secrets.LITELLM_FALLBACK_MODELS }}
          LLM_CHANNELS: ${{ vars.LLM_CHANNELS || secrets.LLM_CHANNELS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || secrets.GEMINI_MODEL || 'gemini-3-flash-preview' }}
          GEMINI_MODEL_FALLBACK: ${{ vars.GEMINI_MODEL_FALLBACK || secrets.GEMINI_MODEL_FALLBACK || 'gemini-2.5-flash' }}
          GEMINI_REQUEST_DELAY: '3.0'
          AIHUBMIX_KEY: ${{ secrets.AIHUBMIX_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_KEYS: ${{ secrets.OPENAI_API_KEYS }}
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL || secrets.OPENAI_BASE_URL }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || secrets.OPENAI_MODEL }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_API_KEYS: ${{ secrets.DEEPSEEK_API_KEYS }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_API_KEYS: ${{ secrets.ANTHROPIC_API_KEYS }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL || secrets.ANTHROPIC_MODEL || 'claude-3-5-sonnet-20241022' }}
          LLM_PRIMARY_PROTOCOL: ${{ vars.LLM_PRIMARY_PROTOCOL || secrets.LLM_PRIMARY_PROTOCOL }}
          LLM_PRIMARY_BASE_URL: ${{ vars.LLM_PRIMARY_BASE_URL || secrets.LLM_PRIMARY_BASE_URL }}
          LLM_PRIMARY_API_KEY: ${{ secrets.LLM_PRIMARY_API_KEY }}
          LLM_PRIMARY_API_KEYS: ${{ secrets.LLM_PRIMARY_API_KEYS }}
          LLM_PRIMARY_MODELS: ${{ vars.LLM_PRIMARY_MODELS || secrets.LLM_PRIMARY_MODELS }}
          LLM_PRIMARY_ENABLED: ${{ vars.LLM_PRIMARY_ENABLED || secrets.LLM_PRIMARY_ENABLED }}
          LLM_PRIMARY_EXTRA_HEADERS: ${{ vars.LLM_PRIMARY_EXTRA_HEADERS || secrets.LLM_PRIMARY_EXTRA_HEADERS }}
          LLM_SECONDARY_PROTOCOL: ${{ vars.LLM_SECONDARY_PROTOCOL || secrets.LLM_SECONDARY_PROTOCOL }}
          LLM_SECONDARY_BASE_URL: ${{ vars.LLM_SECONDARY_BASE_URL || secrets.LLM_SECONDARY_BASE_URL }}
          LLM_SECONDARY_API_KEY: ${{ secrets.LLM_SECONDARY_API_KEY }}
          LLM_SECONDARY_API_KEYS: ${{ secrets.LLM_SECONDARY_API_KEYS }}
          LLM_SECONDARY_MODELS: ${{ vars.LLM_SECONDARY_MODELS || secrets.LLM_SECONDARY_MODELS }}
          LLM_SECONDARY_ENABLED: ${{ vars.LLM_SECONDARY_ENABLED || secrets.LLM_SECONDARY_ENABLED }}
          LLM_AIHUBMIX_PROTOCOL: ${{ vars.LLM_AIHUBMIX_PROTOCOL || secrets.LLM_AIHUBMIX_PROTOCOL }}
          LLM_AIHUBMIX_BASE_URL: ${{ vars.LLM_AIHUBMIX_BASE_URL || secrets.LLM_AIHUBMIX_BASE_URL }}
          LLM_AIHUBMIX_API_KEY: ${{ secrets.LLM_AIHUBMIX_API_KEY }}
          LLM_AIHUBMIX_API_KEYS: ${{ secrets.LLM_AIHUBMIX_API_KEYS }}
          LLM_AIHUBMIX_MODELS: ${{ vars.LLM_AIHUBMIX_MODELS || secrets.LLM_AIHUBMIX_MODELS }}
          LLM_AIHUBMIX_ENABLED: ${{ vars.LLM_AIHUBMIX_ENABLED || secrets.LLM_AIHUBMIX_ENABLED }}
          LLM_GEMINI_API_KEY: ${{ secrets.LLM_GEMINI_API_KEY }}
          LLM_GEMINI_API_KEYS: ${{ secrets.LLM_GEMINI_API_KEYS }}
          LLM_GEMINI_MODELS: ${{ vars.LLM_GEMINI_MODELS || secrets.LLM_GEMINI_MODELS }}
          LLM_GEMINI_ENABLED: ${{ vars.LLM_GEMINI_ENABLED || secrets.LLM_GEMINI_ENABLED }}
          LLM_DEEPSEEK_API_KEY: ${{ secrets.LLM_DEEPSEEK_API_KEY }}
          LLM_DEEPSEEK_API_KEYS: ${{ secrets.LLM_DEEPSEEK_API_KEYS }}
          LLM_DEEPSEEK_MODELS: ${{ vars.LLM_DEEPSEEK_MODELS || secrets.LLM_DEEPSEEK_MODELS }}
          LLM_DEEPSEEK_ENABLED: ${{ vars.LLM_DEEPSEEK_ENABLED || secrets.LLM_DEEPSEEK_ENABLED }}
          LLM_OPENAI_API_KEY: ${{ secrets.LLM_OPENAI_API_KEY }}
          LLM_OPENAI_API_KEYS: ${{ secrets.LLM_OPENAI_API_KEYS }}
          LLM_OPENAI_BASE_URL: ${{ vars.LLM_OPENAI_BASE_URL || secrets.LLM_OPENAI_BASE_URL }}
          LLM_OPENAI_MODELS: ${{ vars.LLM_OPENAI_MODELS || secrets.LLM_OPENAI_MODELS }}
          LLM_OPENAI_ENABLED: ${{ vars.LLM_OPENAI_ENABLED || secrets.LLM_OPENAI_ENABLED }}

          # —— TradingAgents 专用 ——
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY || secrets.GEMINI_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          DASHSCOPE_CN_API_KEY: ${{ secrets.DASHSCOPE_CN_API_KEY }}
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          ZHIPU_CN_API_KEY: ${{ secrets.ZHIPU_CN_API_KEY }}
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          MINIMAX_CN_API_KEY: ${{ secrets.MINIMAX_CN_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          TRADINGAGENTS_LLM_PROVIDER: ${{ vars.TRADINGAGENTS_LLM_PROVIDER || secrets.TRADINGAGENTS_LLM_PROVIDER }}
          TRADINGAGENTS_DEEP_THINK_LLM: ${{ vars.TRADINGAGENTS_DEEP_THINK_LLM || secrets.TRADINGAGENTS_DEEP_THINK_LLM }}
          TRADINGAGENTS_QUICK_THINK_LLM: ${{ vars.TRADINGAGENTS_QUICK_THINK_LLM || secrets.TRADINGAGENTS_QUICK_THINK_LLM }}
          TRADINGAGENTS_LLM_BACKEND_URL: ${{ vars.TRADINGAGENTS_LLM_BACKEND_URL || secrets.TRADINGAGENTS_LLM_BACKEND_URL }}
          TRADINGAGENTS_OUTPUT_LANGUAGE: ${{ vars.TRADINGAGENTS_OUTPUT_LANGUAGE || secrets.TRADINGAGENTS_OUTPUT_LANGUAGE }}
          TRADINGAGENTS_MAX_DEBATE_ROUNDS: ${{ vars.TRADINGAGENTS_MAX_DEBATE_ROUNDS || secrets.TRADINGAGENTS_MAX_DEBATE_ROUNDS || '1' }}
          TRADINGAGENTS_MAX_RISK_ROUNDS: ${{ vars.TRADINGAGENTS_MAX_RISK_ROUNDS || secrets.TRADINGAGENTS_MAX_RISK_ROUNDS || '1' }}

          # —— 数据源 ——
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
          TUSHARE_HTTP_URL: ${{ vars.TUSHARE_HTTP_URL || secrets.TUSHARE_HTTP_URL }}
          TICKFLOW_API_KEY: ${{ secrets.TICKFLOW_API_KEY }}
          TICKFLOW_PRIORITY: ${{ vars.TICKFLOW_PRIORITY || secrets.TICKFLOW_PRIORITY }}
          TICKFLOW_KLINE_ADJUST: ${{ vars.TICKFLOW_KLINE_ADJUST || secrets.TICKFLOW_KLINE_ADJUST }}
          LONGBRIDGE_OAUTH_CLIENT_ID: ${{ vars.LONGBRIDGE_OAUTH_CLIENT_ID || secrets.LONGBRIDGE_OAUTH_CLIENT_ID }}
          LONGBRIDGE_OAUTH_TOKEN_CACHE_B64: ${{ secrets.LONGBRIDGE_OAUTH_TOKEN_CACHE_B64 }}
          LONGBRIDGE_APP_KEY: ${{ secrets.LONGBRIDGE_APP_KEY }}
          LONGBRIDGE_APP_SECRET: ${{ secrets.LONGBRIDGE_APP_SECRET }}
          LONGBRIDGE_ACCESS_TOKEN: ${{ secrets.LONGBRIDGE_ACCESS_TOKEN }}
          LONGBRIDGE_REGION: ${{ vars.LONGBRIDGE_REGION || secrets.LONGBRIDGE_REGION }}
          REALTIME_SOURCE_PRIORITY: ${{ vars.REALTIME_SOURCE_PRIORITY || 'tencent,akshare_sina,efinance,akshare_em' }}

          # —— 搜索 ——
          ANSPIRE_API_KEYS: ${{ secrets.ANSPIRE_API_KEYS }}
          ANSPIRE_LLM_MODEL: ${{ vars.ANSPIRE_LLM_MODEL || secrets.ANSPIRE_LLM_MODEL }}
          ANSPIRE_LLM_BASE_URL: ${{ vars.ANSPIRE_LLM_BASE_URL || secrets.ANSPIRE_LLM_BASE_URL }}
          ANSPIRE_LLM_ENABLED: ${{ vars.ANSPIRE_LLM_ENABLED || secrets.ANSPIRE_LLM_ENABLED }}
          BOCHA_API_KEYS: ${{ secrets.BOCHA_API_KEYS }}
          TAVILY_API_KEYS: ${{ secrets.TAVILY_API_KEYS }}
          SERPAPI_API_KEYS: ${{ secrets.SERPAPI_API_KEYS }}
          MINIMAX_API_KEYS: ${{ secrets.MINIMAX_API_KEYS }}
          BRAVE_API_KEYS: ${{ secrets.BRAVE_API_KEYS }}
          SEARXNG_BASE_URLS: ${{ vars.SEARXNG_BASE_URLS || secrets.SEARXNG_BASE_URLS }}
          SEARXNG_PUBLIC_INSTANCES_ENABLED: ${{ vars.SEARXNG_PUBLIC_INSTANCES_ENABLED || secrets.SEARXNG_PUBLIC_INSTANCES_ENABLED }}

          # —— 通知 ——
          WECHAT_WEBHOOK_URL: ${{ secrets.WECHAT_WEBHOOK_URL }}
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          FEISHU_WEBHOOK_SECRET: ${{ secrets.FEISHU_WEBHOOK_SECRET }}
          DINGTALK_WEBHOOK_URL: ${{ secrets.DINGTALK_WEBHOOK_URL }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EMAIL_SENDER: ${{ vars.EMAIL_SENDER || secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECEIVERS: ${{ vars.EMAIL_RECEIVERS || secrets.EMAIL_RECEIVERS }}
          EMAIL_SENDER_NAME: ${{ vars.EMAIL_SENDER_NAME || secrets.EMAIL_SENDER_NAME || '量化分析助手' }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          PUSHPLUS_TOPIC: ${{ vars.PUSHPLUS_TOPIC || secrets.PUSHPLUS_TOPIC }}
          CUSTOM_WEBHOOK_URLS: ${{ secrets.CUSTOM_WEBHOOK_URLS }}
          NOTIFICATION_REPORT_CHANNELS: ${{ vars.NOTIFICATION_REPORT_CHANNELS || secrets.NOTIFICATION_REPORT_CHANNELS }}

          # —— 运行默认（可被 quant_params 覆盖） ——
          STOCK_LIST_CONFIG: ${{ vars.STOCK_LIST || secrets.STOCK_LIST }}
          MARKET_REVIEW_REGION: ${{ vars.MARKET_REVIEW_REGION || secrets.MARKET_REVIEW_REGION || 'cn' }}
          REPORT_TYPE: ${{ vars.REPORT_TYPE || secrets.REPORT_TYPE || 'simple' }}
          REPORT_LANGUAGE: ${{ vars.REPORT_LANGUAGE || secrets.REPORT_LANGUAGE || 'zh' }}
          MARKET_REVIEW_ENABLED: ${{ vars.MARKET_REVIEW_ENABLED || secrets.MARKET_REVIEW_ENABLED || 'true' }}
          TRADING_DAY_CHECK_ENABLED: ${{ vars.TRADING_DAY_CHECK_ENABLED || secrets.TRADING_DAY_CHECK_ENABLED || 'true' }}
          ENABLE_CHIP_DISTRIBUTION: ${{ vars.ENABLE_CHIP_DISTRIBUTION || secrets.ENABLE_CHIP_DISTRIBUTION || 'false' }}
          LOG_LEVEL: INFO
          MAX_WORKERS: ${{ vars.MAX_WORKERS || secrets.MAX_WORKERS || '1' }}
          QUANT_PARAMS: ${{ github.event.inputs.quant_params || '{}' }}
          QUANT_PRODUCT: ${{ steps.resolve.outputs.product }}
          QUANT_ENGINE: ${{ steps.resolve.outputs.engine }}

          # —— 编排层 ——
          JOB_ID: ${{ github.event.inputs.job_id }}
          SYMBOL: ${{ github.event.inputs.stock_symbol }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ANALYSIS_DOCS_BRANCH: analysis-results
        run: |
          set -euo pipefail
          # 若配置了 QUANT_ENV* 则先注入；否则只用上面逐条 Secrets/Variables
          # shellcheck disable=SC1091
          source ../orchestrator/scripts/inject_quant_env.sh
          bash ../orchestrator/scripts/quant_bridge.sh mark analyze || true
          bash ../orchestrator/scripts/run_quant_analysis.sh \
            "${{ github.event.inputs.stock_symbol }}" \
            "${{ github.event.inputs.mode || 'stocks-only' }}" \
            "${{ github.event.inputs.force_run || 'true' }}"

      - name: Upload analysis artifact
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: analysis-reports-${{ github.run_number }}
          path: |
            analysis/reports/
            analysis/logs/
          retention-days: 30

      - name: Quant bridge finish
        if: always()
        env:
          SYMBOL: ${{ github.event.inputs.stock_symbol }}
          JOB_ID: ${{ github.event.inputs.job_id }}
          QUANT_PRODUCT: ${{ steps.resolve.outputs.product }}
          QUANT_ENGINE: ${{ steps.resolve.outputs.engine }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ANALYSIS_DOCS_BRANCH: analysis-results
          REPORTS_DIR: analysis/reports
          QUANT_JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          if [ -z "${JOB_ID:-}" ]; then
            echo "❌ 缺少 inputs.job_id" >&2
            exit 1
          fi
          bash orchestrator/scripts/quant_bridge.sh finish
